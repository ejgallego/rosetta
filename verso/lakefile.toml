name = "verso-rosetta"
defaultTargets = ["VersoRosetta"]
testDriver = "VersoRosettaTests"

[[require]]
name = "rosetta"
path = ".."

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.35.0"

[[lean_lib]]
name = "VersoRosetta"

[[lean_exe]]
name = "VersoRosettaTests"
srcDir = "tests"
needs = ["rosetta-workflow"]

[[lean_lib]]
name = "RosettaWorkflow"
srcDir = "examples"

[[lean_exe]]
name = "rosetta-workflow"
srcDir = "examples"
root = "WorkflowMain"
