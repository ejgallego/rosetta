name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [v4.35.0, v4.36.0-rc2]
    steps:
      - uses: actions/checkout@v4
      - name: Select core toolchain
        run: echo 'leanprover/lean4:${{ matrix.toolchain }}' > lean-toolchain
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: true
          use-github-cache: false
      - name: Build real prover acceptance targets
        run: nice -n 10 lake build RosettaProverProfiles rosetta-real-provers
      - name: Check real prover runner with mock tools
        if: matrix.toolchain == 'v4.35.0'
        run: python3 tests/check_real_prover_harness.py
  verso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Lake's local Git consumer fetch needs a complete source repository.
          fetch-depth: 0
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: verso
          auto-config: false
          build: true
          test: true
      - name: Check pinned Git consumers and isolation
        run: python3 tests/check_packages.py
